<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{projectName}}｜引弘企業社</title><link rel="stylesheet" href="../../proposal-system/shared-portfolio.css"><style>body{margin:0;background:#f5f1e9;color:#20201e;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.7}.wrap{max-width:1100px;margin:auto;padding:72px 24px}header{background:#19251f;color:white}.eyebrow{letter-spacing:.15em;color:#b7d87a;font-size:12px;font-weight:800}.hero h1{font-size:clamp(42px,7vw,84px);line-height:1.05;margin:16px 0}.lead{max-width:720px;color:#d6ded8}.panel{background:white;border-radius:20px;padding:32px;margin-top:20px}.price{font-size:34px;font-weight:800}.meta{color:#777}h2{font-size:36px;margin:0 0 12px}footer{text-align:center;color:#777;padding:40px}</style></head><body><header><div class="wrap hero"><div class="eyebrow">{{eyebrow}}</div><h1>{{clientName}}<br>{{projectName}}</h1><p class="lead">{{headline}}</p></div></header><main><section class="wrap"><h2>專案方向</h2><p>{{summary}}</p><div class="panel"><h2>服務內容</h2><ul>{{serviceItems}}</ul><p class="price">{{price}}</p><p class="meta">合作期間：{{duration}}</p></div></section><section class="wrap"><div class="eyebrow">SELECTED WORK</div><h2>短影音代操實績</h2><p>作品資料由中央作品庫同步更新；最後更新：<span data-portfolio-updated>載入中</span></p><div class="shared-portfolio-grid" data-shared-portfolio></div></section></main><footer>{{contact}}</footer><script src="../../proposal-system/shared-portfolio.js"></script></body></html>
